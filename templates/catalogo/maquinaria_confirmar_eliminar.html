<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Baja - Maquinaria SpA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm p-4 text-center bg-white">
            <h3 class="text-danger mb-3">¿Estás seguro?</h3>
            <p>Vas a dar de baja lógica al equipo: <strong>{{ maquinaria.nombre }}</strong> ({{ maquinaria.codigo }}).</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Sí, dar de baja</button>
                <a href="{% url 'catalogo:lista' %}" class="btn btn-secondary w-100">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
