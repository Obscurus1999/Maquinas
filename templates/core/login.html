{% extends 'core/base.html' %}

{% block title %}Iniciar Sesión | Maquinaria SpA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border p-4 bg-white rounded-3">
            <h3 class="fw-bold mb-3 text-center">Iniciar Sesión</h3>
            
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-dark fw-bold">Ingresar</button>
                </div>
            </form>
            
            <div class="text-center mt-3">
                <p class="small text-muted">¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-dark fw-bold">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
